name: Rust security remediation

on:
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:
    inputs:
      publish:
        description: Publish or clean up the rolling remediation pull request
        type: boolean
        default: false

permissions:
  actions: read
  contents: read

jobs:
  remediate:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      vars.UPD_SECURITY_REMEDIATION_ENABLED == 'true'
    uses: rvben/upd/.github/workflows/dependency-remediation.yml@c4d663a21961188f4ef7962416cecd519b4df69b
    with:
      publish: >-
        ${{ (github.event_name == 'schedule' &&
             vars.UPD_SECURITY_REMEDIATION_ENABLED == 'true') ||
            (github.event_name == 'workflow_dispatch' && inputs.publish) }}
      langs: rust
      allowed-paths: Cargo.toml Cargo.lock
      validation-command: cargo fmt -- --check && cargo clippy --all-targets -- -D warnings && cargo test
      branch: security/upd
      commit-message: "fix(deps): remediate vulnerable Rust dependencies with upd"
      pull-request-title: "fix(deps): remediate vulnerable Rust dependencies with upd"
      app-id: ${{ vars.UPD_APP_ID }}
    secrets:
      app-private-key: ${{ secrets.UPD_APP_PRIVATE_KEY }}
