name: Rust security remediation

on:
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:
    inputs:
      publish:
        description: Publish or clean up the rolling remediation pull request
        type: boolean
        default: false

permissions:
  actions: read
  contents: read
  id-token: write

jobs:
  remediate:
    uses: rvben/upd/.github/workflows/dependency-remediation.yml@00a1a422decb858811ff2fd3de4ffe0c0eedde08 # v0.14.4
    with:
      publish: >-
        ${{ github.event_name == 'schedule' ||
            (github.event_name == 'workflow_dispatch' && inputs.publish) }}
      langs: rust
      allowed-paths: Cargo.toml Cargo.lock
      validation-command: cargo fmt -- --check && cargo clippy --all-targets -- -D warnings && cargo test
      branch: security/upd
      commit-message: "fix(deps): remediate vulnerable Rust dependencies with upd"
      pull-request-title: "fix(deps): remediate vulnerable Rust dependencies with upd"
