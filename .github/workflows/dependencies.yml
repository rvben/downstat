name: Dependency health

on:
  schedule:
    - cron: "52 6 * * 2"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  packages: read
  pull-requests: read

jobs:
  update:
    uses: rvben/upd/.github/workflows/dependency-health.yml@c4c07ab66084ea6484dc76e9bc2f7875933d12fb # v0.18.3
    with:
      langs: rust,actions
      lock: true
      min-age: 7d
      max-bump: minor
      prepare-command: >-
        rustup toolchain install 1.96.0 --profile minimal --component clippy,rustfmt &&
        rustup default 1.96.0
      validation-command: cargo fmt -- --check && cargo clippy --all-targets -- -D warnings && cargo test
      fail-on-blocked: false
      branch: deps/upd
      commit-message: "chore(deps): weekly dependency update"
      auto-merge: true
      merge-method: squash
      allowed-paths: >-
        .github/workflows/*.yaml
        .github/workflows/*.yml
        Cargo.lock
        Cargo.toml
