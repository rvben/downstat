name: Dependency health

on:
  schedule:
    - cron: "52 6 * * 2"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  packages: read
  pull-requests: read

jobs:
  update:
    uses: rvben/upd/.github/workflows/dependency-health.yml@00a1a422decb858811ff2fd3de4ffe0c0eedde08 # v0.14.4
    with:
      langs: rust,actions
      lock: true
      min-age: 7d
      max-bump: minor
      prepare-command: >-
        rustup toolchain install 1.96.0 --profile minimal --component clippy,rustfmt &&
        rustup default 1.96.0
      validation-command: cargo fmt -- --check && cargo clippy --all-targets -- -D warnings && cargo test
      fail-on-blocked: false
      branch: deps/upd
      commit-message: "chore(deps): weekly dependency update"
